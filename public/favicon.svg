<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <!-- Background Spirit Glow Gradients -->
    <radialGradient id="spiritGlow" cx="42%" cy="48%" r="58%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="30%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#4c1d95" />
    </radialGradient>

    <!-- Outer Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="40%" stop-color="#c084fc" />
      <stop offset="85%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Wizard Hat Shading -->
    <linearGradient id="hatGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Golden Hatband -->
    <linearGradient id="goldBand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Eye Hollow Gradient -->
    <linearGradient id="eyeHollow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090a12" />
      <stop offset="100%" stop-color="#181926" />
    </linearGradient>

    <!-- Glow Filter for Favicon Pop -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Outer Flame Halo -->
  <path d="M 64 12 C 40 18, 22 42, 22 72 C 22 96, 40 118, 66 118 C 92 118, 110 96, 110 72 C 110 48, 94 30, 78 20 C 74 32, 60 26, 64 12 Z" 
        fill="#9333ea" opacity="0.3" filter="url(#softGlow)" />

  <!-- Mystic Wisp Body / Head -->
  <!-- Wispy flame curls on left and top -->
  <path d="M 64 22 
           C 52 14, 38 12, 34 26 
           C 31 38, 42 42, 38 52 
           C 34 60, 24 62, 24 74 
           C 24 98, 42 116, 66 116 
           C 92 116, 108 98, 108 74 
           C 108 50, 92 34, 76 26 
           C 72 32, 68 28, 64 22 Z" 
        fill="url(#spiritGlow)" />

  <!-- Top Splash Wisp Drops -->
  <circle cx="36" cy="10" r="4.5" fill="#f472b6" />
  <circle cx="28" cy="24" r="3" fill="#c084fc" />

  <!-- Glossy Highlight Curve on Head -->
  <path d="M 44 46 C 40 56, 42 70, 48 76 C 54 82, 66 84, 74 80 C 66 76, 56 70, 52 58 C 48 48, 48 44, 44 46 Z" 
        fill="#ffffff" opacity="0.35" />

  <!-- Crooked Wizard Hat on Head -->
  <!-- Hat Brim -->
  <ellipse cx="64" cy="46" rx="36" ry="10" fill="url(#hatGrad)" transform="rotate(-7 64 46)" />
  <ellipse cx="64" cy="46" rx="34" ry="8" fill="#4338ca" opacity="0.4" transform="rotate(-7 64 46)" />

  <!-- Crooked Hat Cone (bends dynamically to the top-right) -->
  <path d="M 42 44 
           C 46 32, 54 22, 60 16 
           C 66 10, 74 6, 86 6 
           C 94 6, 96 12, 90 14 
           C 80 16, 76 22, 74 28 
           C 72 34, 74 38, 78 41 
           Z" 
        fill="url(#hatGrad)" />

  <!-- Golden Ribbon Hatband -->
  <path d="M 46 44 C 54 41, 70 38, 77 41 L 76 45 C 69 42, 53 45, 45 48 Z" fill="url(#goldBand)" />

  <!-- Tiny Magic Star on Tip of Hat -->
  <polygon points="90,4 92,10 98,10 93,14 95,20 90,16 85,20 87,14 82,10 88,10" fill="#fde047" filter="url(#softGlow)" />

  <!-- Left Eye Socket (Stylized almond teardrop hollow) -->
  <path d="M 46 64 C 42 66, 38 74, 42 84 C 46 94, 58 92, 60 84 C 62 76, 54 62, 46 64 Z" fill="url(#eyeHollow)" />
  <!-- Left Eye Cyan Glow Reflection -->
  <ellipse cx="48" cy="80" rx="3.5" ry="5.5" fill="#38bdf8" opacity="0.8" />
  <circle cx="47" cy="77" r="1.5" fill="#ffffff" />

  <!-- Right Eye Socket -->
  <path d="M 80 66 C 76 68, 74 76, 78 84 C 82 92, 92 88, 92 80 C 92 72, 86 64, 80 66 Z" fill="url(#eyeHollow)" />
  <!-- Right Eye Cyan Glow Reflection -->
  <ellipse cx="82" cy="78" rx="2.5" ry="4" fill="#38bdf8" opacity="0.8" />
  <circle cx="81" cy="76" r="1.2" fill="#ffffff" />

  <!-- Cute Little Nose Pip -->
  <ellipse cx="68" cy="84" rx="2" ry="2.5" fill="#111827" />

  <!-- Mischievous Scalloped Wizard Smirk -->
  <path d="M 46 88 
           C 52 94, 56 94, 60 90 
           C 64 88, 68 94, 74 94 
           C 80 94, 86 86, 90 84 
           C 86 92, 78 100, 68 100 
           C 58 100, 50 94, 46 88 Z" 
        fill="#090a12" />

  <!-- Little Light Sparkles -->
  <circle cx="98" cy="62" r="1.5" fill="#a5f3fc" />
  <circle cx="34" cy="94" r="1.2" fill="#f472b6" />
</svg>
